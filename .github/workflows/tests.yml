name: Tests

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: tests
    runs-on: [self-hosted, contabo, yeoux]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: No Hypertask keys, account ids or Neon strings
        run: node tools/no-hypertask.mjs
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
